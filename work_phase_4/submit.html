<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/page_css/index.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ruthie&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Courgette&display=swap');
    </style>
    <title>QuickBite - Share You Recipes</title>
</head>

<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header" role="banner">
        <div class="header-inner">
            <a class="logo" href="index.html" aria-label="Return to homepage">QuickBite</a>

            <button class="nav-toggle" aria-controls="primary-nav" aria-expanded="false"
                aria-label="Open main navigation">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </button>

            <nav id="primary-nav" class="primary-nav" role="navigation" aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Homepage</a></li>
                    <li><a href="recipes.html">Recipes</a></li>
                    <li><a href="news.html">Food news</a></li>
                    <li><a href="forum.html">Forum</a></li>
                    <li><a href="submit.html" aria-current="page">Share You Recipes</a>
                </ul>
            </nav>

            <div class="header-actions">
                <button class="btn btn-small js-login-trigger">Login</button>
                <button class="btn btn-small js-signup-trigger">Sign Up</button>
            </div>
        </div>
    </header>

    <main class="container" id="main">

    </main>

    <footer>
        <div class="footer-title">
            <div class="footer-title-left">
                <img src="images/H.png" alt="Heart">
                <span>QuickBite</span>
            </div>
            <span>Click here to follow us</span>
        </div>
        <div class="footer-bottom">
            <span>© 2021 QuickBite. All rights reserved.</span>
            <div class="social-media">
                <a href=""><img src="images/FB.png" alt="Facebook"></a>
                <a href=""><img src="images/INS.png" alt="Instagram"></a>
                <a href=""><img src="images/X.png" alt="X"></a>
            </div>
    </footer>

    <div class="modal-overlay" id="login-modal" aria-hidden="true">
        <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title-login">
            <button class="modal-close" aria-label="Close dialog">&times;</button>
            <div class="modal-content">
                <h2 id="modal-title-login">Welcome Back</h2>
                <form class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input id="login-email" name="email" type="email" required autocomplete="username" />
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input id="login-password" name="password" type="password" required
                            autocomplete="current-password" />
                    </div>
                    <button type="submit" class="btn_l">Login</button>
                </form>
                <p class="forgot-password">
                    <a href="#" aria-label="Reset Password">Forgot your password?</a>
                </p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="signup-modal" aria-hidden="true">
        <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title-signup">
            <button class="modal-close" aria-label="Close dialog">&times;</button>
            <div class="modal-content">
                <h2 id="modal-title-signup">Join Our Community</h1>
                    <form id="community-form" class="auth-form">
                        <div class="form-group">
                            <label for="name">Name:</label>
                            <input id="name" type="text" name="name" required />
                        </div>
                        <div class="form-group">
                            <label for="signup-email">Email:</label>
                            <input id="signup-email" type="email" name="email" required />
                        </div>
                        <div class="form-group">
                            <label for="message">Message:</label>
                            <textarea id="message" name="message" rows="4"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="photo">Photo (optional):</label>
                            <input id="photo" type="file" name="photo" accept="image/*" />
                        </div>
                        <button type="submit" class="btn_l">Submit</button>
                    </form>
                    <p class="have-account">
                        <a href="#" aria-label="Login">Already have an account?</a>
                    </p>
                    <p id="form-feedback" aria-live="polite"></p>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/modal.js"></script>
    <script type="module" src="js/setting.js"></script>
</body>

</html>
